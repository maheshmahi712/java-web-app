<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>User Management</h1>

    <div class="card">

        <form id="userForm">

            <input
                type="text"
                id="name"
                placeholder="Enter name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <button type="submit">
                Add User
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Users</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="userTableBody"></tbody>

        </table>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
